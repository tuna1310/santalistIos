name: Build SantaList iOS (.ipa)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build & Package SantaList Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Ensure Xcode Project (XcodeGen)
        run: |
          if [ -f "project.yml" ]; then
            if ! command -v xcodegen >/dev/null 2>&1; then
              brew install xcodegen
            fi
            xcodegen generate
          fi
          xcodebuild -list -project SantaList.xcodeproj

      - name: Build for iOS Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SantaList.xcodeproj \
            -scheme SantaList \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build_sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build_sim.log

      - name: Boot Virtual iOS Simulator & Launch App
        run: |
          echo "=== 1. Find and Boot iPhone Simulator ==="
          UDID=$(xcrun simctl list devices available | grep -E "iPhone (15|16|SE)" | head -n 1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[A-F0-9-]{36}')
          fi
          echo "Selected Simulator UDID: $UDID"
          
          xcrun simctl boot "$UDID" || true
          
          for i in $(seq 1 15); do
            STATE=$(xcrun simctl list devices | grep "$UDID" | grep -o "Booted" || true)
            if [ "$STATE" = "Booted" ]; then
              echo "Simulator is in Booted state!"
              break
            fi
            sleep 1
          done
          sleep 4

          echo "=== 2. Locate Built App & Install ==="
          APP_PATH=$(find build_sim -name "SantaList.app" -type d | head -n 1)
          echo "App path found: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "App installed on simulator!"

          echo "=== 3. Launch App on Simulator ==="
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "App Bundle Identifier: $BUNDLE_ID"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          echo "App launched successfully!"

          echo "Waiting 6 seconds for app UI rendering..."
          sleep 6

          echo "=== 4. Capture Simulator Screenshot ==="
          xcrun simctl io "$UDID" screenshot simulator_screenshot.png
          ls -lh simulator_screenshot.png

          echo "=== 5. Running Process Verification ==="
          xcrun simctl spawn "$UDID" ps aux | grep -i "SantaList" || true

          xcrun simctl shutdown "$UDID" || true

      - name: Upload Simulator Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: SantaList-Simulator-Screenshot
          path: simulator_screenshot.png
          if-no-files-found: error
          retention-days: 30

      - name: Archive Release Device App (Unsigned arm64)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SantaList.xcodeproj \
            -scheme SantaList \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build_archive/SantaList.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build_archive.log

      - name: Package & Ad-Hoc Sign Unsigned IPA
        run: |
          APP_PATH="build_archive/SantaList.xcarchive/Products/Applications/SantaList.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::SantaList.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SantaList.app
          codesign --force --deep --sign - --timestamp=none Payload/SantaList.app || true
          zip -qry SantaList-unsigned.ipa Payload
          ls -lh SantaList-unsigned.ipa

      - name: Upload SantaList Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SantaList-unsigned-IPA
          path: SantaList-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
