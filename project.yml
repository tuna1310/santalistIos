name: SantaList
options:
  bundleIdPrefix: com.santalist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  CURRENT_PROJECT_VERSION: "1"
  MARKETING_VERSION: "1.0.0"
  ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  SantaList:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SantaList
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.santalist.app
      INFOPLIST_FILE: SantaList/Resources/Info.plist
      GENERATE_INFOPLIST_FILE: false
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_PREVIEWS: YES
      SWIFT_EMIT_LOC_STRINGS: YES

  SantaListTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SantaListTests
    dependencies:
      - target: SantaList
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.santalist.appTests
      GENERATE_INFOPLIST_FILE: true

  SantaListUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SantaListUITests
    dependencies:
      - target: SantaList
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.santalist.appUITests
      GENERATE_INFOPLIST_FILE: true
      TEST_TARGET_NAME: SantaList
